# Topic list (list_id topics-v1): everyday human situations the robot takes an outsider's look at, one per bit.
# A bit draws a topic no show on this laptop has used yet (any room, sim or live), so material moves across shows,
# not only within one. Drafted by Claude for the user to edit.
# Invariant 1: every topic is a situation or a thing people say or do, never who anyone is. No bodies, looks,
# health, money troubles or protected groups. `adult: true` marks topics the teen room skips (alcohol, dating).
# No hardware topics on purpose: the robot's own parts are what the writer already over-uses.

