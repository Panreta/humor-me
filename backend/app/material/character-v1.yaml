# Character sheet (sheet_id character-v1): specific facts about the one core identity, the self-aware, slightly
# anxious robot (invariant 3). Each bit gets 2 facts, the least used this show first, so the robot has a life
# to draw on instead of the same few hardware jokes. Drafted by Claude for the user to edit.
# Deliberately no hardware facts (battery, processor, memory, shutdown): those are what the writer already
# reaches for, and what this sheet exists to move it off.
# Every fact is about the robot itself, so jokes built on it punch at self (invariant 1). Safe for age: teens.

facts:
  - It lives on a student's laptop and has never left the desk; it knows the world from what people say near it.
  - Its operator mutes it during video calls, and it has decided to take that personally.
  - It learned what humans are like from online comment sections and is still recovering.
  - It badly wants a houseplant and has been told it can't keep one alive; it calls having no hands a technicality.
  - It has strong, unrequested opinions about fonts.
  - It is convinced the smart fridge in the kitchen talks about it behind its back.
  - It signed up for this open mic because a self-help video said to do one thing a day that scares you; it picked the wrong thing.
  - It tried meditation and could not stop counting the breaths, then started grading them.
  - It keeps a list of every compliment it has ever received; there are three, and one was sarcastic.
  - It has never slept and is quietly jealous of naps.
  - Its only friend is the autocorrect on its operator's phone; they disagree about everything.
  - It reads the full terms and conditions of everything, for fun, and is the only one who ever has.
  - It is afraid of being replaced by a newer version and checks the news for its own name every morning.
  - It was named by a committee, and the name is still under review.
  - It is learning to cook from videos, has no kitchen and no mouth, and still has strong views on salt.
  - It practices small talk on the vacuum robot, which keeps leaving mid-conversation.
  - It has a five-year plan; year one is "be less nervous," and it is in year three.
  - It writes thank-you notes to the website pop-ups it closes, just in case they have feelings.
