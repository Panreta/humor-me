# source: audience | performer (unattributed sounds = speaker, per subtitle convention) | person:<name>
# intense: laugh with an intensity modifier -> level 3
# Levels are derived in pipeline/markers.py; add new strings here, never guess at run time.
# Reviewed 2026-10-20: performer first names (brian, jeff, tom, ...) mapped to performer.
# "... continues" markers extend the preceding audience reaction -> audience.
